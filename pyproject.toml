[project]
name = "afterwatch"
version = "1.0.0"
description = "Turn your YouTube watching into a knowledge base: structured notes, self-updating hubs, watch-history backfill"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
    "yt-dlp>=2026.8.19",
    "yt-dlp-ejs>=0.8",  # YouTube refuses frame downloads (403) without it
    "youtube-transcript-api>=1.0",
    "keyring>=25",  # API keys live in the OS credential store, never in the config file
]

[project.optional-dependencies]
discord = ["discord.py>=2.3"]
docx = ["python-docx>=1.1"]
dev = ["pytest>=8"]

[project.scripts]
afterwatch = "afterwatch.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["afterwatch", "afterwatch.prompts"]

[tool.setuptools.package-data]
afterwatch = ["prompts/*.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
